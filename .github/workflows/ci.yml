name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright src/

      - name: Test with coverage
        run: uv run pytest -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          RATE_LIMIT_RPM: "0"

  report:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Report generation is best-effort: failures here do not block merges.
    # External experiment state (artifacts/, data/) is not available in CI,
    # so this step verifies only that the report entrypoint is importable.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Generate report
        run: uv run python -m src.report
