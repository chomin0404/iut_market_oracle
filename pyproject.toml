[project]
name = "iut-market-oracle"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "matplotlib>=3.10.8",
    "numpy>=1.26",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.12.0",
    "uvicorn[standard]>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
filterwarnings = [
    # Starlette's internal ExceptionMiddleware/ServerErrorMiddleware creates a
    # `dispatch` coroutine during TestClient teardown that Python's GC detects
    # as unawaited.  This is a known Starlette internals issue — not caused by
    # application code — and all tests pass cleanly.
    "ignore:coroutine 'dispatch' was never awaited:RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "bayesian", "core", "entropy", "exit", "experiments",
    "fragmentation", "gnss", "graph", "huh_twin", "matroid",
    "modeling_api", "models", "schemas", "strategy_twin",
    "twin", "valuation", "yield_twin",
]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation must precede matplotlib.use("Agg") and all other imports
"src/report.py" = ["E402"]
# sys.path manipulation must precede all intra-project imports
"src/gnss/__main__.py" = ["E402"]

[tool.coverage.run]
omit = [
    # Report generation script — requires full experiment state to run
    "src/report.py",
    # GNSS visualization scripts — matplotlib output, not unit-testable
    "src/gnss/report.py",
    "src/gnss/validation_report.py",
    # CLI entry points — tested via subprocess, not importable unit tests
    "src/gnss/__main__.py",
    "src/models/__main__.py",
    "src/fragmentation/__main__.py",
]

[tool.pyright]
pythonVersion = "3.10"
include = ["src", "tests"]
extraPaths = ["src"]
strict = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.0",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]
