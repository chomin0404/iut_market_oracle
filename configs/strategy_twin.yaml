# Strategy Twin (T1700) — default configuration.
#
# Moat Adjustments
# ----------------
# max_wacc_reduction:  Maximum WACC reduction from moat score (250 bps).
# max_growth_uplift:   Maximum terminal growth uplift from moat score (150 bps).
# min_wacc_floor:      Minimum WACC after adjustment (4%).
# min_spread:          Minimum spread between WACC and terminal growth (50 bps).
#
# Black-Litterman
# ---------------
# delta:  Risk-aversion coefficient (He-Litterman default: 2.5).
# tau:    Confidence scale on equilibrium prior (default: 0.05).
# rho:    Uniform off-diagonal correlation in covariance matrix (default: 0.30).
#
# Viability (Reverse DCF)
# -----------------------
# bisect_low:  Lower bound on implied growth rate search (-50%).
# bisect_high: Upper bound on implied growth rate search (+80%).
#
# Causal SCM
# ----------
# max_path_depth: Maximum DFS depth for path enumeration (default: 20).

moat:
  max_wacc_reduction: 0.025
  max_growth_uplift: 0.015
  min_wacc_floor: 0.04
  min_spread: 0.005

black_litterman:
  delta: 2.5
  tau: 0.05
  rho: 0.30

viability:
  bisect_low: -0.50
  bisect_high: 0.80

causal:
  max_path_depth: 20

